name: Ads lifecycle cron

# El plan Hobby de Vercel solo permite crons diarios -- no alcanza para
# activar/finalizar campañas de La Gran Barata Ads con la cadencia real
# que necesitan (cada 30 min). Este workflow gratuito de GitHub Actions
# hace ese trabajo en su lugar, llamando al mismo endpoint que ya existe
# (/api/cron/ads-lifecycle), protegido con el mismo CRON_SECRET real.
# vercel.json mantiene además una corrida diaria como red de seguridad.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    name: Activar/finalizar campañas vencidas
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron/ads-lifecycle
        run: |
          curl -sf -X GET "https://sanlorenzodigital.vercel.app/api/cron/ads-lifecycle" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
