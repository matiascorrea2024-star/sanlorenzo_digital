<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12091f"/>
      <stop offset="45%" stop-color="#26104b"/>
      <stop offset="100%" stop-color="#090b18"/>
    </linearGradient>

    <radialGradient id="violet">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blue">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1250" cy="200" r="360" fill="url(#violet)" filter="url(#blur)"/>
  <circle cx="300" cy="700" r="330" fill="url(#blue)" filter="url(#blur)"/>

  <g opacity=".14" stroke="#fff" fill="none">
    <path d="M0 180 Q400 100 800 180 T1600 180"/>
    <path d="M0 320 Q400 240 800 320 T1600 320"/>
    <path d="M0 460 Q400 380 800 460 T1600 460"/>
    <path d="M0 600 Q400 520 800 600 T1600 600"/>
    <path d="M0 740 Q400 660 800 740 T1600 740"/>
  </g>

  <g transform="translate(1050 230)">
    <rect x="0" y="0" width="380" height="470" rx="34"
      fill="#fff" fill-opacity=".07"
      stroke="#fff" stroke-opacity=".18"/>

    <rect x="28" y="28" width="324" height="170" rx="24"
      fill="#a855f7" fill-opacity=".22"/>

    <circle cx="190" cy="110" r="48"
      fill="#fff" fill-opacity=".12"
      stroke="#fff" stroke-opacity=".25"/>

    <path d="M190 76 L190 145 M156 110 L224 110"
      stroke="#fff" stroke-width="8"
