    <rect x="28" y="222" width="210" height="16" rx="8"
      fill="#fff" fill-opacity=".28"/>

    <rect x="28" y="254" width="270" height="10" rx="5"
      fill="#fff" fill-opacity=".12"/>

    <rect x="28" y="294" width="145" height="52" rx="16"
      fill="#a855f7" fill-opacity=".35"/>

    <rect x="185" y="294" width="167" height="52" rx="16"
      fill="#fff" fill-opacity=".08"/>

    <circle cx="55" cy="390" r="18"
      fill="#22c55e"/>

    <rect x="85" y="382" width="180" height="12" rx="6"
      fill="#fff" fill-opacity=".18"/>
  </g>

  <g fill="#fff">
    <circle cx="210" cy="150" r="4" opacity=".8"/>
    <circle cx="420" cy="250" r="3" opacity=".5"/>
    <circle cx="720" cy="120" r="5" opacity=".7"/>
    <circle cx="930" cy="680" r="4" opacity=".5"/>
    <circle cx="1370" cy="760" r="5" opacity=".7"/>
